config-version = 2

after-startup-command = []
start-at-login = true

# Normalizations
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30

default-root-container-layout = 'accordion'
default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
automatically-unhide-macos-hidden-apps = false

persistent-workspaces = ["0", "9", "Terms", "Editor", "Browsers", "Agents", "H", "F", "N", "S", "O"]

on-mode-changed = []

[key-mapping]
    preset = 'qwerty'

[gaps]
    inner.horizontal = 8
    inner.vertical =   8
    outer.left =       8
    outer.bottom =     8
    outer.top =        0
    outer.right =      8

# App → workspace routing (order matters: catch-all must be last)

### TERMINALS

[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = 'move-node-to-workspace Terms'

[[on-window-detected]]
if.app-id = "com.apple.Terminal"
run = 'move-node-to-workspace Terms'

### EDITORS

[[on-window-detected]]
if.app-name-regex-substring = 'Zed'
run = 'move-node-to-workspace Editor'

# Cursor
[[on-window-detected]]
if.app-id = 'com.todesktop.230313mzl4w4u92'
run = 'move-node-to-workspace Editor'

### BROWSERS
[[on-window-detected]]
if.app-id = "com.google.Chrome"
run = 'move-node-to-workspace Browsers'

[[on-window-detected]]
if.app-name-regex-substring = 'Zen'
run = 'move-node-to-workspace Browsers'

[[on-window-detected]]
if.app-name-regex-substring = 'Claude'
run = 'move-node-to-workspace Agents'

[[on-window-detected]]
if.app-id = 'com.google.Chrome.app.cmpjhfcplodfceehidopdiafjkbgmiaj'
run = 'move-node-to-workspace Agents'

[[on-window-detected]]
if.app-name-regex-substring = 'Helium'
run = 'move-node-to-workspace H'

[[on-window-detected]]
if.app-name-regex-substring = 'Figma'
run = 'move-node-to-workspace F'

[[on-window-detected]]
if.app-id = 'notion.id'
run = 'move-node-to-workspace N'

[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run = 'move-node-to-workspace S'

[[on-window-detected]]
if.app-name-regex-substring = 'Obsidian'
run = 'move-node-to-workspace O'

# Catch-all: everything else goes to workspace 0, floating
[[on-window-detected]]
if = 'true'
run = ['move-node-to-workspace 0', 'layout floating']

[mode.main.binding]
    # Switch to workspace
    ctrl-alt-cmd-e = 'workspace Editor'
    ctrl-alt-cmd-z = 'workspace Browsers'
    ctrl-alt-cmd-c = 'workspace Agents'
    ctrl-alt-cmd-h = 'workspace H'
    ctrl-alt-cmd-f = 'workspace F'
    ctrl-alt-cmd-n = 'workspace N'
    ctrl-alt-cmd-s = 'workspace S'
    ctrl-alt-cmd-o = 'workspace O'
    ctrl-alt-cmd-0 = 'workspace 0'
    ctrl-alt-cmd-9 = 'workspace 9'
    ctrl-alt-cmd-backtick = 'workspace Terms'
    # Cycle forward through windows in current workspace
    ctrl-alt-cmd-tab = 'focus --boundaries-action wrap-around-the-workspace dfs-next'

    # Move current workspace to next monitor
    ctrl-alt-cmd-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    # Move current window to workspace
    ctrl-alt-cmd-shift-backtick = 'move-node-to-workspace Terms'
    ctrl-alt-cmd-shift-e = 'move-node-to-workspace Editor'
    ctrl-alt-cmd-shift-z = 'move-node-to-workspace Browsers'
    ctrl-alt-cmd-shift-c = 'move-node-to-workspace Agents'
    ctrl-alt-cmd-shift-h = 'move-node-to-workspace H'
    ctrl-alt-cmd-shift-f = 'move-node-to-workspace F'
    ctrl-alt-cmd-shift-n = 'move-node-to-workspace N'
    ctrl-alt-cmd-shift-s = 'move-node-to-workspace S'
    ctrl-alt-cmd-shift-o = 'move-node-to-workspace O'
    ctrl-alt-cmd-shift-0 = 'move-node-to-workspace 0'
    ctrl-alt-cmd-shift-9 = 'move-node-to-workspace 9'

    # Toggle layout tiles <-> accordion
    ctrl-alt-cmd-minus = 'layout tiles accordion'

    # Re-apply the on-window-detected rules to windows already open
    ctrl-alt-cmd-shift-r = 'run-callback --for-every-window on-window-detected'

    # Service mode — commented out, uncomment if needed
    # ctrl-alt-cmd-shift-semicolon = 'mode service'

